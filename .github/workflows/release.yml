name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: windows
            archive_ext: zip
          - os: ubuntu-latest
            asset_name: linux
            archive_ext: tar.gz
          - os: macos-latest
            asset_name: macos
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg archives
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install (executable + resolved runtime deps + assets)
        run: cmake --install build --prefix dist

      - name: Archive (zip, Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath Othello-${{ matrix.asset_name }}-${{ runner.arch }}.zip

      - name: Archive (tar.gz, Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: tar -C dist -czf Othello-${{ matrix.asset_name }}-${{ runner.arch }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Othello-${{ matrix.asset_name }}-${{ runner.arch }}
          path: Othello-${{ matrix.asset_name }}-${{ runner.arch }}.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
