name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: windows
            archive_ext: zip
          - os: ubuntu-latest
            asset_name: linux
            archive_ext: tar.gz
          - os: macos-latest
            asset_name: macos
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # vcvars (msvc-dev-cmd) rewrites PATH and can hide the image's Ninja.
      - name: Install Ninja
        shell: bash
        run: |
          add_to_path() {
            echo "$1" >> "$GITHUB_PATH"
            export PATH="$1:$PATH"
          }

          if ! command -v ninja >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux)
                sudo apt-get update
                sudo apt-get install -y ninja-build
                ;;
              macOS)
                brew install ninja
                ;;
              Windows)
                found=
                for dir in "/c/Tools/Ninja" "/c/Program Files/Ninja" "/c/ProgramData/chocolatey/bin"; do
                  if [ -x "$dir/ninja.exe" ]; then
                    add_to_path "$dir"
                    found=1
                    break
                  fi
                done
                if [ -z "$found" ]; then
                  choco install ninja --yes --no-progress
                  add_to_path "/c/ProgramData/chocolatey/bin"
                fi
                ;;
            esac
          fi

          ninja --version

      - name: Install Linux SFML system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libudev-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Cache vcpkg archives
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        run: cmake --preset Release

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install (executable + resolved runtime deps + assets)
        run: cmake --install build --prefix dist

      - name: Archive (zip, Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath Othello-${{ matrix.asset_name }}-${{ runner.arch }}.zip

      - name: Archive (tar.gz, Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: tar -C dist -czf Othello-${{ matrix.asset_name }}-${{ runner.arch }}.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Othello-${{ matrix.asset_name }}-${{ runner.arch }}
          path: Othello-${{ matrix.asset_name }}-${{ runner.arch }}.${{ matrix.archive_ext }}

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
